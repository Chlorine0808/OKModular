
plugins {
    id 'com.gtnewhorizons.gtnhconvention'
}

minecraft {
    //Creates a tag in Tags with the above generated mod version, instead of the "clean" one
    injectedTags.put("RAW_VERSION", project.modVersion)
    injectedTags.put("MOD_ID", project.modId)
    injectedTags.put("MOD_NAME", project.modName)
    injectedTags.put("MOD_GROUP", project.modGroup)
}

tasks.withType(JavaCompile) {
    options.compilerArgs << "-Xlint:deprecation"
}

test {
    useJUnitPlatform()

    // DocumentedJsonTypeTest reads docs/ to check that every documented JSON type has a
    // parser. Gradle only knows about the classpath, so editing a doc left :test
    // UP-TO-DATE and the reconciliation silently reported the previous run's answer.
    inputs.dir(file('docs'))
        .withPropertyName('docs')
        .withPathSensitivity(PathSensitivity.RELATIVE)
}
